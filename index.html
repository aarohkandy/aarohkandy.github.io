            // Book data
            const books = [

            // Spring physics for smooth, flowy animation
            class SpringFollower {
                constructor(element) {
                    this.element = element;
                    this.currentY = window.innerHeight / 2;
                    this.targetY = window.innerHeight / 2;
                    this.velocity = 0;
                    this.spring = 0.1;
                    this.damping = 0.8;
                    this.animate();
                }

                setTarget(y) {
                    this.targetY = y;
                }

                animate() {
                    const force = (this.targetY - this.currentY) * this.spring;
                    this.velocity += force;
                    this.velocity *= this.damping;
                    this.currentY += this.velocity;

                    this.element.style.top = this.currentY + 'px';
                    this.element.style.transform = 'translateY(-50%)';

                    requestAnimationFrame(() => this.animate());
                }
            }

            // Check if large screen (desktop/laptop) - use both width and touch detection
            const isLargeScreen = window.innerWidth > 1024 && !('ontouchstart' in window);
            
            let leftFollower, rightFollower;
            
            // Only enable spring animation on large screens
            if (isLargeScreen) {
                // Initialize spring followers
                leftFollower = new SpringFollower(leftButton);
                rightFollower = new SpringFollower(rightButton);

                // Track mouse position
                let mouseY = window.innerHeight / 2;
                document.addEventListener('mousemove', (e) => {
                    mouseY = e.clientY;
                    leftFollower.setTarget(mouseY);
                    rightFollower.setTarget(mouseY);
                });
            } else {
                // On mobile/tablet, disable any animation and fix buttons next to name
                leftButton.style.position = 'fixed';
                rightButton.style.position = 'fixed';
                leftButton.style.willChange = 'auto';
                rightButton.style.willChange = 'auto';
                
                // Ensure buttons don't move with any animation
                function positionButtonsNextToName() {
                    if (nameWrapper.classList.contains('animate-to-top')) {
                        const nameRect = nameWrapper.getBoundingClientRect();
                        const nameCenterY = nameRect.top + (nameRect.height / 2);
                        
                        // Use requestAnimationFrame to ensure position is set
                        requestAnimationFrame(() => {
                            leftButton.style.top = nameCenterY + 'px';
                            rightButton.style.top = nameCenterY + 'px';
                            leftButton.style.transform = 'translateY(-50%)';
                            rightButton.style.transform = 'translateY(-50%)';
                        });
                    } else {
                        requestAnimationFrame(() => {
                            leftButton.style.top = '50%';
                            rightButton.style.top = '50%';
                            leftButton.style.transform = 'translateY(-50%)';
                            rightButton.style.transform = 'translateY(-50%)';
                        });
                    }
                }
                
                // Position buttons initially
                positionButtonsNextToName();
                
                // Position buttons when name animates to top
                setTimeout(() => {
                    positionButtonsNextToName();
                }, 600); // After name animation completes
                
                // Update on resize and when name animates
                window.addEventListener('resize', positionButtonsNextToName);
                
                // Watch for name animation
                const observer = new MutationObserver(() => {
                    positionButtonsNextToName();
                });
                observer.observe(nameWrapper, { attributes: true, attributeFilter: ['class'] });
            }

            // Auto-animate name to top after 0.25s
            setTimeout(() => {
                nameWrapper.classList.add('animate-to-top');
                
                // Show intro text and timeline after name animation completes
                setTimeout(() => {
                    introText.classList.add('visible');
                    timelineContainer.classList.add('visible');
                    
                    // Stagger timeline boxes
                    const boxes = timelineContainer.querySelectorAll('.timeline-box');
                    boxes.forEach((box, index) => {
                        setTimeout(() => {
                            box.classList.add('visible');
                        }, index * 100);
                    });
                }, 300);
            }, 250);

            // Helper function to parse date and determine if ongoing
            function parseDate(dateString) {
                const isOngoing = dateString.includes('Present');
                // Extract start date (first part before " - ")
                const startDate = dateString.split(' - ')[0];
                return { startDate, isOngoing };
            }

            // Function to check if any box is expanded and update container
            function updateContainerScroll() {
                const hasExpanded = Array.from(timelineContainer.querySelectorAll('.timeline-box')).some(
                    box => box.classList.contains('expanded')
                );
                if (hasExpanded) {
                    timelineContainer.classList.add('has-expanded');
                } else {
                    timelineContainer.classList.remove('has-expanded');
                }
            }

            // Create timeline boxes (reverse order so newest is first)
            accomplishments.slice().reverse().forEach((item, index) => {
                const { startDate, isOngoing } = parseDate(item.date);
                const box = document.createElement('div');
                box.className = `timeline-box ${isOngoing ? 'ongoing' : 'completed'}`;
                
                const companyLabel = item.company ? `<div class="timeline-company">${item.company}</div>` : '';
                
                box.innerHTML = `
                    <div class="timeline-title-row">
                        <div class="timeline-title">${item.title}</div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            ${companyLabel}
                            <div class="timeline-date">${startDate}</div>
                        </div>
                    </div>
                    <div class="timeline-details">${item.details}</div>
                `;
                
                box.addEventListener('click', function() {
                    // Close all other boxes
                    const allBoxes = timelineContainer.querySelectorAll('.timeline-box');
                    allBoxes.forEach(otherBox => {
                        if (otherBox !== box) {
                            otherBox.classList.remove('expanded');
                        }
                    });
                    
                    // Toggle the clicked box
                    const wasExpanded = box.classList.contains('expanded');
                    box.classList.toggle('expanded');
                    updateContainerScroll();
                    
                    // Scroll to box if it's being expanded
                    if (!wasExpanded && box.classList.contains('expanded')) {
                        setTimeout(() => {
                            box.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }, 100);
                    }
                });
                
                timelineContainer.appendChild(box);
            });

            // Create book cards
            books.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="book-cover">
                        <img src="${book.cover}" alt="${book.title}" onerror="this.style.display='none'; this.parentElement.innerHTML='📚';">
                    </div>
                    <div class="book-title">${book.title}</div>
                    <div class="book-author">${book.author}</div>
                `;
                bookGrid.appendChild(card);
            });

            // Slide functions
            function slideToMain() {
                slideContainer.classList.remove('slide-right', 'slide-left');
                currentView = 'main';
                updateButtonLabels();
            }

            function slideToContact() {
                slideContainer.classList.remove('slide-left');
                slideContainer.classList.add('slide-right');
                currentView = 'contact';
                updateButtonLabels();
            }

            function slideToLibrary() {
                slideContainer.classList.remove('slide-right');
                slideContainer.classList.add('slide-left');
                currentView = 'library';
                updateButtonLabels();
            }

            // Update button labels, handlers, and visibility based on current view
            function updateButtonLabels() {
                if (currentView === 'main') {
                    leftButton.textContent = 'contact';
                    rightButton.textContent = 'library';
                    leftButton.onclick = slideToContact;
                    rightButton.onclick = slideToLibrary;
                    leftButton.classList.remove('hidden');
                    rightButton.classList.remove('hidden');
                } else if (currentView === 'contact') {
                    rightButton.textContent = 'main';
                    rightButton.onclick = slideToMain;
                    leftButton.classList.add('hidden');
                    rightButton.classList.remove('hidden');
                } else if (currentView === 'library') {
                    leftButton.textContent = 'main';
                    leftButton.onclick = slideToMain;
                    leftButton.classList.remove('hidden');
                    rightButton.classList.add('hidden');
                }
            }

            // Button handlers
            updateButtonLabels();
            contactBackButton.addEventListener('click', slideToMain);
            libraryBackButton.addEventListener('click', slideToMain);
        });
    </script>
</body>
</html>
